---
# External-endpoint Service: routes in-cluster traffic for
# ollama.chickenflow.svc.cluster.local:11434 to Ollama running on node one61.
# Ollama is installed as a systemd service on the host (not a Pod), so we use
# a selector-less Service backed by a manually-maintained Endpoints object.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: chickenflow
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: chickenflow
subsets:
  - addresses:
      - ip: 10.0.3.2  # one61 node IP; update if the LLM host moves.
    ports:
      - name: http
        port: 11434
        protocol: TCP
