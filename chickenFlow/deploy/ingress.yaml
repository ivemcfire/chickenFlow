# Optional — for browser access via chickenflow.local
# Requires nginx-ingress controller and local DNS or /etc/hosts entry.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chickenflow-ingress
  namespace: chickenflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"       # ESP32-CAM image uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"    # WebSocket keepalive
    nginx.ingress.kubernetes.io/enable-websocket: "true"
spec:
  rules:
    - host: chickenflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chickenflow-svc
                port:
                  number: 80
