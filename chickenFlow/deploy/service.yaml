# LoadBalancer (MetalLB) — ESP32-CAM hardcodes this IP.
# If MetalLB isn't available, change type to NodePort and set nodePort: 30400,
# then hardcode a k3s node's static LAN IP on the ESP32.
apiVersion: v1
kind: Service
metadata:
  name: chickenflow-svc
  namespace: chickenflow
spec:
  type: LoadBalancer
  selector:
    app: chickenflow
  ports:
    - name: http
      port: 80
      targetPort: 4000
    - name: ws
      port: 4000
      targetPort: 4000
