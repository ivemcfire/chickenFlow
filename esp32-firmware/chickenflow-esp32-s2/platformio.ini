[env:esp32s2mini]
platform = espressif32 @ ~6.11.0   ; Arduino-ESP32 core 2.0.17 — keeps the old ledcSetup/ledcAttachPin API used by music.cpp
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.17
build_src_filter = +<main.cpp> +<music.cpp>
