[env:esp32s2mini]
platform = espressif32 @ ~6.11.0   ; Arduino-ESP32 core 2.0.17 — keeps the old ledcSetup/ledcAttachPin API used by music.cpp
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
; Phones on this host also enumerate as /dev/ttyACM* — pin to the LOLIN-S2-MINI.
; If the ACM number shifts (phone reboot order), override with `--upload-port`.
upload_port = /dev/ttyACM3
monitor_port = /dev/ttyACM3
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit INA219 @ ^1.2.3
    adafruit/RTClib @ ^2.1.4
    dmkishi/Dusk2Dawn @ ^1.0.1
build_src_filter = +<main.cpp> +<music.cpp>
; Dusk2Dawn 1.0.1 is unmaintained and needs two source patches to build
; on modern GCC + Linux. See tools/patch_dusk2dawn.py for details.
extra_scripts = pre:tools/patch_dusk2dawn.py
board_upload.after = no_reset