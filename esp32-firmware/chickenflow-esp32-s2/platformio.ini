[env:esp32s2mini]
platform = espressif32 @ ~6.11.0   ; Arduino-ESP32 core 2.0.17 — keeps the old ledcSetup/ledcAttachPin API used by music.cpp
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
; Phones on this host also enumerate as /dev/ttyACM* — pin to the LOLIN-S2-MINI.
; If the ACM number shifts (phone reboot order), override with `--upload-port`.
upload_port = /dev/ttyACM3
monitor_port = /dev/ttyACM3
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.17
build_src_filter = +<main.cpp> +<music.cpp>
